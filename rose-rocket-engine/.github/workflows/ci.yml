name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -q

      - name: Offline dry-run smoke
        env:
          OFFLINE_DRY_RUN: "1"
          FORCE_EDITION: "1"
        run: python rose_rocket_engine.py
